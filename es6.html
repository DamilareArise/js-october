        const showCars = () => {
            myScreen.innerHTML = ""
            cars.forEach((value) => {
                myScreen.innerHTML += `<li>${value}</li>`
            })
        }

        const searchCar = () => {
            if (searchInput.value){
                let res = cars.filter((value) => {
                    return value.toLowerCase().includes(searchInput.value.toLowerCase())
                })
                
                myScreen.innerHTML = ""
                res.forEach((value) => {
                    myScreen.innerHTML += `<li>${value}</li>`
                })
                
            }else{
                showCars()
            }
